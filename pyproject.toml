[project]
name = "ai-collaborate"
version = "0.1.0"
description = "Orchestrate AI agents with diverse models for collaborative reasoning and debate"
requires-python = ">=3.12"
dependencies = ["openai"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.9",
]

[tool.ruff]
# 不碰 Markdown 里嵌的 Python 片段：文档与笔记正文不属格式化范围
extend-exclude = ["*.md"]
